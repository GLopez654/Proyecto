<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Energy Global / Ecoglobal S.A.S.</title>
    
    <!-- Ruta del CSS corregida (sin barra al inicio) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Tu barra de navegación o Header -->
    <header>
        <!-- Asegúrate de que tus menús y enlaces estén aquí -->
    </header>

    <main>
        <!-- Sección de Alianzas y Empresas -->
        <section class="partners-carousel-section" aria-labelledby="alianzas-title">
            <div class="partners-carousel-heading">
                <p class="eyebrow">Empresas</p>
                <h2 id="alianzas-title">Experiencia operativa y alianzas clave.</h2>
                <p>Organizaciones que han confiado en nuestra capacidad técnica y presencia en campo.</p>
            </div>
            
            <!-- Carrusel de empresas -->
            <div class="partners-card-carousel auto-card-carousel" aria-label="Empresas aliadas y clientes">
                <article class="partner-card">
                    <img src="assets/images/cliente-alcaldia-yondo.png" alt="Alcaldía de Yondó, Antioquia">
                    <p>Alcaldía de Yondó, Antioquia</p>
                </article>
                <article class="partner-card">
                    <img src="assets/images/cliente-general-rigs.png" alt="General Rigs Services S.A.S.">
                    <p>General Rigs Services S.A.S.</p>
                </article>
                <article class="partner-card">
                    <img src="assets/images/cliente-kerui.png" alt="Kerui Petroleum Equipment Co., Ltd.">
                    <p>Kerui Petroleum Equipment</p>
                </article>
                <article class="partner-card">
                    <img src="assets/images/cliente-petromovil.png" alt="Petromóvil de Colombia S.A.S.">
                    <p>Petromóvil de Colombia S.A.S.</p>
                </article>
                <article class="partner-card">
                    <img src="assets/images/Empresa5.jpeg" alt="Empresa aliada">
                    <p>Empresa aliada</p>
                </article>
            </div>

            <!-- Botón de Brochure centrado -->
            <div class="brochure-container-center">
                <a href="assets/brochure.pdf" class="btn-brochure" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Descargar Brochure PDF
                </a>
            </div>
        </section>
    </main>

    <footer>
        <!-- Pie de página -->
    </footer>

</body>
</html>
